[project]
name = "pfm-backend"
version = "0.1.0"
description = "Family Budget & Expense Tracker — API (Feature-01: User Onboarding)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

# This is an application, not a distributable library — no build backend needed.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "smtp: sends through real Gmail SMTP. Opt-in via `-m smtp`; needs .env credentials.",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

# TM-US-02: B008 (function-call-in-default-argument) skips parameters whose
# annotated type is a recognised-immutable builtin (str, int, ...) — every
# prior `= Query(...)` default in this codebase happened to be one of those,
# so this never mattered before. `datetime` is not on that built-in list, so
# `date_from`/`date_to`: `datetime | None = Query(None)` (plan.md's own
# router sketch) is the first Query default to trip B008. `fastapi.Query`
# genuinely is immutable-safe to call at import time the same way `Depends`
# is, so it is added to the exemption list rather than restyled away from
# plan.md's literal design.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false
